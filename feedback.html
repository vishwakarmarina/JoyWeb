<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Joy</title>
<meta name="description" content="Send feedback about JoyFlow, Keystroke, or JoyMind.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
<style>
  .feedback-page-container {
    max-width: 560px;
    margin: 60px auto;
    padding: 0 24px;
  }

  .feedback-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .feedback-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }

  .feedback-header p {
    color: var(--text-secondary);
    font-size: 15px;
  }

  .feedback-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    background: var(--paper);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 6px;
  }

  .feedback-tab {
    flex: 1;
    text-align: center;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .feedback-tab:hover {
    color: var(--white);
  }

  .feedback-tab.active {
    background: var(--purple);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(109,93,246,0.3);
  }

  .feedback-form {
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 32px;
    backdrop-filter: blur(10px);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group:last-child {
    margin-bottom: 0;
  }

  .form-label {
    display: block;
    color: var(--white);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .form-input,
  .form-textarea {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
    transition: border-color 0.2s ease;
  }

  .form-input:focus,
  .form-textarea:focus {
    outline: none;
    border-color: var(--purple);
  }

  .form-input::placeholder,
  .form-textarea::placeholder {
    color: var(--text-tertiary);
  }

  .form-textarea {
    resize: vertical;
    min-height: 120px;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .hashtag-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 8px;
    font-family: 'Space Mono', monospace;
  }

  .submit-btn {
    width: 100%;
    padding: 14px 24px;
    background: linear-gradient(135deg, var(--purple-light), var(--purple));
    border: none;
    border-radius: 8px;
    color: var(--white);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(109,93,246,0.4);
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(109,93,246,0.55);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .success-message {
    display: none;
    padding: 14px 16px;
    background: rgba(76,63,209,0.15);
    border: 1px solid rgba(139,124,246,0.3);
    border-radius: 8px;
    color: var(--purple-light);
    text-align: center;
    font-size: 13px;
    font-family: 'Inter', -apple-system, sans-serif;
    margin-bottom: 16px;
  }

  .success-message.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .feedback-page-container {
      margin: 40px auto;
    }

    .feedback-header h1 {
      font-size: 32px;
    }

    .feedback-form {
      padding: 24px;
    }

    .feedback-tabs {
      flex-wrap: wrap;
    }

    .feedback-tab {
      flex: 1;
      min-width: 90px;
    }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-icon" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="joyGrad" x1="0" y1="0" x2="32" y2="32">
            <stop offset="0%" stop-color="#8B7CF6"/>
            <stop offset="100%" stop-color="#6D5DF6"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#joyGrad)"/>
        <text x="16" y="23" text-anchor="middle" font-family="'Bebas Neue', sans-serif" font-size="19" fill="#fff">J</text>
      </svg>
      <span>Joy</span>
    </div>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">JoyFlow</a>
      <a href="keystroke.html" class="nav-tab">Keystroke</a>
      <a href="joymind.html" class="nav-tab">JoyMind</a>
    </div>
  </div>
</nav>

<div class="feedback-page-container">
  <div class="feedback-header">
    <h1>Send Feedback</h1>
    <p>Help us improve the Joy family. Your feedback matters.</p>
  </div>

  <div class="feedback-form">
    <div class="success-message" id="successMessage">✓ Feedback sent! Thank you for helping us improve.</div>

    <div class="feedback-tabs">
      <button class="feedback-tab active" data-product="joyflow">JoyFlow</button>
      <button class="feedback-tab" data-product="keystroke">Keystroke</button>
      <button class="feedback-tab" data-product="joymind">JoyMind</button>
    </div>

    <form id="feedbackForm">
      <div class="form-group">
        <label class="form-label">Your Email</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Feedback Type</label>
        <select class="form-input" id="feedbackType" required style="cursor: pointer;">
          <option value="">Select a type</option>
          <option value="bug">Bug Report</option>
          <option value="feature">Feature Request</option>
          <option value="improvement">Improvement</option>
          <option value="general">General Feedback</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Your Message</label>
        <textarea class="form-textarea" id="message" placeholder="Tell us what you think..." required></textarea>
        <div class="hashtag-hint" id="hashtag">#joyflow will be added automatically</div>
      </div>

      <button type="submit" class="submit-btn">Send Feedback</button>
    </form>
  </div>
</div>

<footer class="footer" style="margin-top: 60px;">
  <div class="section-inner footer-inner">
    <p class="footer-copy">Your feedback helps shape the future of Joy. Thank you! · <a href="privacy.html" style="color: var(--text-tertiary);">Privacy Policy</a></p>
  </div>
</footer>

<script>
  const feedbackTabs = document.querySelectorAll('.feedback-tab');
  const feedbackForm = document.getElementById('feedbackForm');
  const successMessage = document.getElementById('successMessage');
  const hashtagHint = document.getElementById('hashtag');
  let selectedProduct = 'joyflow';

  // Tab switching
  feedbackTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      feedbackTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      selectedProduct = tab.dataset.product;
      
      // Update hashtag hint
      const productNames = {
        'joyflow': '#joyflow',
        'keystroke': '#keystroke',
        'joymind': '#joymind'
      };
      hashtagHint.textContent = `${productNames[selectedProduct]} will be added automatically`;
    });
  });

  // Form submission
  feedbackForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const feedbackType = document.getElementById('feedbackType').value;
    const message = document.getElementById('message').value;
    
    // Add hashtag to message
    const fullMessage = `${message}\n\n#${selectedProduct}`;
    
    // Create mailto link (you can replace this with an actual backend API)
    const mailto = `mailto:feedback@joyfamily.com?subject=Feedback: ${selectedProduct} - ${feedbackType}&body=From: ${email}\n\nProduct: ${selectedProduct}\nType: ${feedbackType}\n\nMessage:\n${fullMessage}`;
    
    // For now, just show success (in production, send to backend)
    console.log('Feedback:', { email, feedbackType, message: fullMessage, product: selectedProduct });
    
    // Show success message
    successMessage.classList.add('show');
    feedbackForm.reset();
    feedbackTabs[0].click(); // Reset to first tab
    
    // Hide success message after 4 seconds
    setTimeout(() => {
      successMessage.classList.remove('show');
    }, 4000);
    
    // Optionally open email client
    // window.location.href = mailto;
  });
</script>

</body>
</html>
